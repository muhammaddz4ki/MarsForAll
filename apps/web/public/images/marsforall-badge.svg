<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer Technical Bezel (Flat Solid Matte) -->
  <circle cx="250" cy="250" r="236" fill="#0b0f17" stroke="#1e293b" stroke-width="4" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#ea580c" stroke-width="2" />

  <!-- Radar & Elevation Grids -->
  <line x1="250" y1="38" x2="250" y2="462" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="38" y1="250" x2="462" y2="250" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 6" />
  <circle cx="250" cy="250" r="100" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 6" />

  <!-- Mount Sharp (Aeolis Mons) Mountain Geometric Silhouette (Flat Solids) -->
  <polygon points="120,330 210,210 270,250 340,195 400,330" fill="#31130e" />
  <polygon points="100,345 250,145 315,240 410,345" fill="#9a3412" />
  <polygon points="250,145 250,345 410,345 315,240" fill="#451a03" />

  <!-- Boxwork Mineral Vein Lattice (Solid Amber Lines) -->
  <g stroke="#d97706" stroke-width="2.5" fill="none">
    <path d="M 180,305 L 210,280 L 255,295 L 290,270 L 330,290" />
    <path d="M 210,280 L 225,250 L 265,245 L 290,270" />
    <path d="M 225,250 L 250,215 L 280,225 L 265,245" />
    <path d="M 195,330 L 230,315 L 270,330 L 310,315" />
    <line x1="210" y1="280" x2="230" y2="315" />
    <line x1="255" y1="295" x2="270" y2="330" />
    <line x1="290" y1="270" x2="310" y2="315" />
  </g>

  <!-- Rover / Astronaut Traverse Path (Solid Cyan Dotted Trail) -->
  <path d="M 130,340 Q 170,325 210,335 T 260,310 T 320,295 T 370,315"
        fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="5 4" />
  <circle cx="130" cy="340" r="4.5" fill="#16a34a" />
  <circle cx="320" cy="295" r="5" fill="#d97706" stroke="#ffffff" stroke-width="1.5" />

  <!-- Badge Typography Banner: Top Arc & Bottom Arc -->
  <path id="topTextArc" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
  <path id="bottomTextArc" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />

  <text fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="20" font-weight="900" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      MARSFORALL // GALE-01
    </textPath>
  </text>

  <text fill="#94a3b8" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="700" letter-spacing="2.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      INTERPLANETARY SURVIVAL &amp; GALE SURVEY
    </textPath>
  </text>

  <!-- Technical Reticle Accents -->
  <rect x="246" y="24" width="8" height="8" fill="#ea580c" />
  <rect x="246" y="468" width="8" height="8" fill="#ea580c" />
  <rect x="24" y="246" width="8" height="8" fill="#ea580c" />
  <rect x="468" y="246" width="8" height="8" fill="#ea580c" />
</svg>
