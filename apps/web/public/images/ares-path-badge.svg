<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="marsSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#18131e" />
      <stop offset="100%" stop-color="#2a1415" />
    </linearGradient>
    <linearGradient id="rustPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="45%" stop-color="#c83f21" />
      <stop offset="100%" stop-color="#73190b" />
    </linearGradient>
    <linearGradient id="goldVein" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="hudCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Technical Bezel -->
  <circle cx="250" cy="250" r="236" fill="url(#marsSkyGrad)" stroke="#334155" stroke-width="3" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#f97316" stroke-width="2" opacity="0.8" />

  <!-- Radar & Elevation Grids -->
  <line x1="250" y1="38" x2="250" y2="462" stroke="#475569" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
  <line x1="38" y1="250" x2="462" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 6" opacity="0.6" />
  <circle cx="250" cy="250" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 6" opacity="0.6" />

  <!-- Mount Sharp (Aeolis Mons) Mountain Geometric Silhouette -->
  <!-- Background Ridge -->
  <polygon points="120,330 210,210 270,250 340,195 400,330" fill="#401815" opacity="0.7" />
  <!-- Central Main Peak -->
  <polygon points="100,345 250,145 315,240 410,345" fill="url(#rustPeak)" />
  <!-- Facet Shadow / Stratigraphy Layers -->
  <polygon points="250,145 250,345 410,345 315,240" fill="#52150b" opacity="0.55" />

  <!-- 2025 Boxwork Mineral Vein Lattice (Polygonal Crystalline Ridge Network) -->
  <g stroke="url(#goldVein)" stroke-width="2.5" fill="none" filter="url(#glow)">
    <path d="M 180,305 L 210,280 L 255,295 L 290,270 L 330,290" />
    <path d="M 210,280 L 225,250 L 265,245 L 290,270" />
    <path d="M 225,250 L 250,215 L 280,225 L 265,245" />
    <path d="M 195,330 L 230,315 L 270,330 L 310,315" />
    <line x1="210" y1="280" x2="230" y2="315" />
    <line x1="255" y1="295" x2="270" y2="330" />
    <line x1="290" y1="270" x2="310" y2="315" />
  </g>

  <!-- Rover / Astronaut Traverse Path (Cyan dotted telemetry trail) -->
  <path d="M 130,340 Q 170,325 210,335 T 260,310 T 320,295 T 370,315"
        fill="none" stroke="url(#hudCyan)" stroke-width="3" stroke-dasharray="5 4" filter="url(#glow)" />
  <circle cx="130" cy="340" r="4.5" fill="#22c55e" />
  <circle cx="320" cy="295" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />

  <!-- Badge Typography Banner: Top Arc & Bottom Arc -->
  <path id="topTextArc" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
  <path id="bottomTextArc" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />

  <text fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="20" font-weight="900" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      ARES-PATH // GALE-01
    </textPath>
  </text>

  <text fill="#cbd5e1" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="700" letter-spacing="2.5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      MOUNT SHARP EXCURSION &amp; BOXWORK SURVEY
    </textPath>
  </text>

  <!-- Technical Coordinate Badges -->
  <text x="250" y="380" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">
    GALE CRATER • 5.4453° S, 137.8414° E
  </text>
  <text x="250" y="398" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="9.5" letter-spacing="1.5">
    AEOLIS MONS STRATIGRAPHIC RECONNAISSANCE
  </text>
</svg>
